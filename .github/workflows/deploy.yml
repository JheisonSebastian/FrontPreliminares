name: Deploy Angular to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npx ng build --base-href "/FrontPreliminares/"

      - name: Add 404.html fallback for SPA routes
        run: |
          ls -la dist dist/preliminares dist/preliminares/browser || true
          if [ -f "dist/preliminares/browser/index.html" ]; then
            cp dist/preliminares/browser/index.html dist/preliminares/browser/404.html
          elif [ -f "dist/preliminares/index.html" ]; then
            cp dist/preliminares/index.html dist/preliminares/404.html
          else
            echo "No se encontró index.html en dist"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/preliminares/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4