<mat-sidenav-container class="sidenav-container">
  
  <!-- Menú lateral -->
  <mat-sidenav
    #drawer
    class="sidenav"
    mode="side"
    [opened]="true"
  >
    <mat-toolbar>Menu</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/usuario">Usuario</a>
      <a mat-list-item routerLink="/conocenos">Conócenos</a>
      <a mat-list-item routerLink="/compra">Compra</a>
      <a mat-list-item routerLink="/perritos">Perritos</a> <!-- <-- Agrega esta línea -->
    </mat-nav-list>
  </mat-sidenav>

  <!-- Contenido principal -->
  <mat-sidenav-content>
    <mat-toolbar style="background-color: green; color: white;">
      <!-- Botón de tres barras siempre visible para alternar el menú -->
      <button type="button" aria-label="Toggle sidenav" mat-icon-button (click)="drawer.toggle()">
        <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
      </button>
      <span>preliminares</span>
    </mat-toolbar>
    
    <!-- Aquí se renderizarán tus vistas/componentes hijos (como perritos, compras, etc.) -->
    <div class="main-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>

</mat-sidenav-container>
